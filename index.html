<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A searchable public information table." />
    <title>Information Calendar</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <p class="eyebrow">PUBLIC REFERENCE</p>
        <h1 id="site-title">Information Calendar</h1>
        <p id="site-introduction" class="introduction"></p>
      </header>

      <section class="table-section" aria-labelledby="table-heading">
        <div class="table-toolbar">
          <div>
            <h2 id="table-heading">Entries</h2>
            <p id="result-count" class="result-count" aria-live="polite"></p>
          </div>
          <label class="search-box">
            <span class="sr-only">Search all entries</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
            </svg>
            <input id="search-input" type="search" placeholder="Search entries…" autocomplete="off" />
          </label>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead><tr id="table-head"></tr></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <strong>No matching entries</strong>
            <span>Try a different word or clear the search.</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
